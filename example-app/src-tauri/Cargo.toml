[package]
name = "busymate-ai-tauri-example"
version = "1.0.1"
description = "Busymate AI SDK for Tauri — example app with a settings view"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = "2.12"
tauri-plugin-busymate-ai = { path = "../../plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
