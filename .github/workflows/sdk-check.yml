name: SDK checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: sdk-check-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
# Our runners only, never GitHub-hosted (owner order 2026-11-04): Linux = ephemeral k3s scale set ci-sdk-tauri
# (class sdk: WebKit2GTK 4.1 / GTK3 / MinGW-w64 preinstalled, no sudo), macOS = the Mac runner
# bm-mac-busymate-ai-sdk-tauri. There is no Windows runner: windows-cross runs clippy for x86_64-pc-windows-gnu on
# Linux (type-checks every cfg(windows) path of the plugin and the example); it cannot run the tests or link.
jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: '"ci-sdk-tauri"' }
          - { os: macos, runner: '["self-hosted","macOS","bm-mac"]' }
    runs-on: ${{ fromJSON(matrix.runner) }}
    # Mac jobs: the timeout includes the wait for the shared Mac's one-job lock.
    timeout-minutes: ${{ contains(toJSON(matrix), 'bm-mac') && 150 || 45 }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview dependencies present (runner class sdk)
        if: runner.os == 'Linux'
        run: pkg-config --exists webkit2gtk-4.1 gtk+-3.0 libsoup-3.0 javascriptcoregtk-4.1 librsvg-2.0 ayatana-appindicator3-0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Toolchain
        run: rustc -V && cargo -V && node -v && npm -v
      - name: Verify release manifest and pinned sources
        run: python3 scripts/verify-release.py || python scripts/verify-release.py
      - name: Test the injected chat glue (identity and microphone ports)
        run: node --test plugin/js-test/chat-init.test.mjs
      - name: Clippy (plugin)
        run: cargo clippy -p tauri-plugin-busymate-ai --all-targets -- -D warnings
      - name: Unit tests (bridge envelopes, origins, microphone requests)
        run: cargo test -p tauri-plugin-busymate-ai
      - name: Build the example frontend
        working-directory: example-app
        run: npm ci && npm run build
      - name: Build the example app
        run: cargo build -p busymate-ai-tauri-example
      - name: Test the example's settings and backend mint mapping
        run: cargo test -p busymate-ai-tauri-example
      - name: Clippy (example)
        run: cargo clippy -p busymate-ai-tauri-example --all-targets -- -D warnings
      - name: Plugin permissions are committed and current
        run: git status --porcelain plugin/permissions && test -z "$(git status --porcelain plugin/permissions)"
      - name: Package the crate and the JS bindings
        if: runner.os == 'Linux'
        run: |
          cargo package -p tauri-plugin-busymate-ai --no-verify --allow-dirty
          mkdir -p out
          cp target/package/tauri-plugin-busymate-ai-1.0.2.crate out/
          (cd plugin/guest-js && npm pack --pack-destination ../../out)
          ls -l out
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: busymate-ai-sdk-tauri-1.0.2
          path: out/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permissions-${{ matrix.os }}
          path: plugin/permissions
  windows-cross:
    name: windows (cross-check from Linux)
    runs-on: ci-sdk-tauri
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the example frontend (embedded by the example crate)
        working-directory: example-app
        run: npm ci && npm run build
      - name: Clippy for Windows (plugin and example, all targets)
        env:
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
        run: cargo clippy --target x86_64-pc-windows-gnu -p tauri-plugin-busymate-ai -p busymate-ai-tauri-example --all-targets -- -D warnings
  sdk-check:
    needs: [build, windows-cross]
    if: ${{ always() && !cancelled() }}  # a cancelled run must not turn the gate red
    runs-on: ci-sdk-tauri
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: No GitHub-hosted runners (runs-on lint)
        run: python3 .github/runs-on-lint.py
      - name: Every OS built, linted and tested
        run: |
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.windows-cross.result }}" = "success"
